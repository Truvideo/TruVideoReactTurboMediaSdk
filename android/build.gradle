buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  // Match React Native’s Kotlin Gradle plugin (see @react-native/gradle-plugin). TruVideo SDKs ship
  // Kotlin 2.3 metadata; use -Xskip-metadata-version-check on compile tasks in consuming projects.
  def kotlin_version = "2.0.21"

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.9.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TruvideoReactTurboMediaSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TruvideoReactTurboMediaSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.truvideoreactturbomediasdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Explicitly set Kotlin language version to match compiler
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      jvmTarget = "17"
      languageVersion = "2.0"
      apiVersion = "2.0"
      freeCompilerArgs += "-Xskip-metadata-version-check"
    }
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

def kodeinVersion = "7.28.0"

configurations.all {
    resolutionStrategy {
        // Align Kodein across all modules to match the SDK bytecode
        force "org.kodein.di:kodein-di:$kodeinVersion"
        force "org.kodein.di:kodein-di-jvm:$kodeinVersion"
        force "org.kodein.di:kodein-di-framework-android-core:$kodeinVersion"
        force "org.kodein.di:kodein-di-framework-android-x:$kodeinVersion"
    }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation("com.truvideo.com:sdk-media:1.0.0" )
  // Kodein DI (align with the version used to compile the SDK to avoid NoSuchMethodError on importAll$default)
//  api "org.kodein.di:kodein-di:$kodeinVersion"
//  api "org.kodein.di:kodein-di-jvm:$kodeinVersion"
//  api "org.kodein.di:kodein-di-framework-android-core:$kodeinVersion"
//  api "org.kodein.di:kodein-di-framework-android-x:$kodeinVersion"
  implementation "org.kodein.di:kodein-di:$kodeinVersion"
//  implementation "org.kodein.di:kodein-di-jvm:$kodeinVersion"
//  implementation "org.kodein.di:kodein-di-framework-android-core:$kodeinVersion"
//  implementation "org.kodein.di:kodein-di-framework-android-x:$kodeinVersion"
  implementation("com.russhwolf:multiplatform-settings:1.3.0")

}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "TruvideoReactTurboMediaSdk"
    codegenJavaPackageName = "com.truvideoreactturbomediasdk"
  }
}
