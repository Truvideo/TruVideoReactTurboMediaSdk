apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "truvideoreactturbomediasdk.example"
    defaultConfig {
        applicationId "truvideoreactturbomediasdk.example"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Ensure multidex is enabled if needed (though it should auto-enable for large apps)
        multiDexEnabled true
        // Keep Kodein DI classes in main dex to ensure they're available during ContentProvider initialization
        multiDexKeepProguard file('src/main/assets/multidex-keep.txt')
    }

    packaging {
        // Ensure all Kodein DI classes are included, especially JAR files
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libjsc.so']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
        // Ensure JAR files from dependencies are merged
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Ensure R8 doesn't strip classes even in debug builds
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Explicitly set Kotlin language version to match truvideo SDK
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            languageVersion = "2.2"
            apiVersion = "2.2"
        }
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

def kodeinVersion = "7.28.0"

configurations.all {

    resolutionStrategy {
        // Force Kodein DI version to ensure consistency
        // DIAware interface was introduced in version 7.0.0, required by truvideo-sdk-android-media:79.1.2
        // Use the same version the SDK was compiled with to avoid NoSuchMethodError on importAll$default
        force "org.kodein.di:kodein-di:$kodeinVersion"
        force "org.kodein.di:kodein-di-jvm:$kodeinVersion"
        force "org.kodein.di:kodein-di-framework-android-core:$kodeinVersion"
        force "org.kodein.di:kodein-di-framework-android-x:$kodeinVersion"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'

    // Kodein DI is required by truvideo-sdk-android-media (version 7.3.0 contains DIAware interface and importAll API)
    // DIAware interface is in kodein-di-core starting from version 7.0.0
    // Include all Kodein DI modules to ensure DIAware is available at runtime
    // Explicitly include all modules to ensure they're packaged in the APK
    implementation "org.kodein.di:kodein-di:$kodeinVersion"
    implementation "org.kodein.di:kodein-di-jvm:$kodeinVersion"
    implementation "org.kodein.di:kodein-di-framework-android-core:$kodeinVersion"
    implementation "org.kodein.di:kodein-di-framework-android-x:$kodeinVersion"
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

if (isNewArchitectureEnabled()) {
    // Since our library doesn't invoke codegen automatically we need to do it here.
    tasks.register('invokeLibraryCodegen', Exec) {
      workingDir "$rootDir/../../"
      def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

      if (isWindows) {
        commandLine 'cmd', '/c', 'npx bob build --target codegen'
      } else {
        commandLine 'sh', '-c', 'npx bob build --target codegen'
      }
    }
    preBuild.dependsOn invokeLibraryCodegen
}
